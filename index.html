<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محفظتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --primary: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px 10px; }
    .container { max-width: 600px; margin: auto; }

    /* Cards & Glass Style */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 15px;
    }

    /* Auth Screen */
    .auth-box { text-align: center; padding: 40px 20px; }
    .auth-box h2 { margin-bottom: 10px; }
    .auth-box p { color: var(--text-muted); margin-bottom: 25px; font-size: 0.9rem; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--primary); }

    /* Buttons & Inputs */
    .btn {
      width: 100%; padding: 12px; border-radius: 10px; border: none;
      font-weight: 700; cursor: pointer; font-size: 0.95rem; margin-top: 5px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); width: auto; padding: 6px 12px; font-size: 0.8rem; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    input, select {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
      background: #0f172a; color: var(--text); outline: none; font-size: 0.9rem;
    }

    /* Summary Dashboard */
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
    .summary-item h5 { color: var(--text-muted); font-size: 0.75rem; margin-bottom: 4px; }
    .summary-item div { font-weight: 700; font-size: 0.95rem; }

    /* Transaction List */
    .tx-list { list-style: none; margin-top: 10px; }
    .tx-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .tx-item:last-child { border-bottom: none; }
    .tx-amount.income { color: var(--primary); font-weight: 700; }
    .tx-amount.expense { color: var(--danger); font-weight: 700; }
  </style>
</head>
<body>

  <div class="container">

    <!-- 1. شاشة الدخول -->
    <div id="authScreen" class="card auth-box">
      <h2>محفظتي الذكية</h2>
      <p>تطبيق بسيط ومباشر لإدارة مصاريفك اليومية</p>
      <button id="loginGoogleBtn" class="btn btn-primary" style="margin-bottom: 10px;">تسجيل الدخول بـ Google</button>
      <button id="loginGuestBtn" class="btn btn-secondary">دخول سريع بدون حساب</button>
    </div>

    <!-- 2. واجهة التطبيق الرئيسية -->
    <div id="appScreen" style="display: none;">
      
      <!-- الهيدر والحساب -->
      <header class="card">
        <div class="user-info">
          <img id="userImg" class="user-avatar" src="" style="display: none;">
          <span id="userName" style="font-weight: 700; font-size: 0.9rem;">زائر</span>
        </div>
        <button id="logoutBtn" class="btn btn-danger">خروج</button>
      </header>

      <!-- ملخص الحساب -->
      <div class="card summary-grid">
        <div class="summary-item">
          <h5>إجمالي الدخل</h5>
          <div id="totalIncome" style="color: var(--primary);">0</div>
        </div>
        <div class="summary-item">
          <h5>إجمالي المصاريف</h5>
          <div id="totalExpense" style="color: var(--danger);">0</div>
        </div>
        <div class="summary-item">
          <h5>المتبقي</h5>
          <div id="totalBalance">0</div>
        </div>
      </div>

      <!-- نموذج إضافة معاملة -->
      <div class="card">
        <h4 style="margin-bottom: 12px; font-size: 0.95rem;">إضافة معاملة جديدة</h4>
        <form id="txForm">
          <div class="form-group">
            <label>النوع</label>
            <select id="txType">
              <option value="expense">مصروف (-)</option>
              <option value="income">دخل (+)</option>
            </select>
          </div>
          <div class="form-group">
            <label>المبلغ</label>
            <input type="number" id="txAmount" placeholder="0.00" step="any" required>
          </div>
          <div class="form-group">
            <label>الوصف</label>
            <input type="text" id="txDesc" placeholder="مثال: غداء، كروت، راتب..." required>
          </div>
          <button type="submit" class="btn btn-primary">حفظ المعاملة</button>
        </form>
      </div>

      <!-- سجل المعاملات -->
      <div class="card">
        <h4 style="margin-bottom: 10px; font-size: 0.95rem;">السجل اليومي</h4>
        <ul id="txList" class="tx-list"></ul>
      </div>

    </div>

  </div>

  <!-- المحرك الأساسي وقاعدة البيانات -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAZa3vYxaetE8zmW6zDqT3ew7pjX2Cx4F8",
      authDomain: "smart-wellat.firebaseapp.com",
      projectId: "smart-wellat",
      storageBucket: "smart-wellat.firebasestorage.app",
      messagingSenderId: "945130034170",
      appId: "1:945130034170:web:86fd5c48b3cb02ee8aca43"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let isGuest = false;
    let transactions = [];

    // عناصر الواجهة
    const authScreen = document.getElementById('authScreen');
    const appScreen = document.getElementById('appScreen');
    const txForm = document.getElementById('txForm');
    const txList = document.getElementById('txList');

    // تسجيل الدخول بـ Google
    document.getElementById('loginGoogleBtn').addEventListener('click', () => {
      const provider = new GoogleAuthProvider();
      signInWithPopup(auth, provider).catch(err => alert("خطأ بالدخول: " + err.message));
    });

    // الدخول كزائر
    document.getElementById('loginGuestBtn').addEventListener('click', () => {
      isGuest = true;
      currentUser = null;
      document.getElementById('userName').textContent = 'حساب زائر';
      document.getElementById('userImg').style.display = 'none';
      loadGuestData();
      showApp();
    });

    // تسجيل الخروج
    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (isGuest) {
        isGuest = false;
        showAuth();
      } else {
        signOut(auth);
      }
    });

    // مراقبة حالة الحساب
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        isGuest = false;
        document.getElementById('userName').textContent = user.displayName || 'مستخدم';
        if (user.photoURL) {
          document.getElementById('userImg').src = user.photoURL;
          document.getElementById('userImg').style.display = 'block';
        }
        listenToUserData();
        showApp();
      } else if (!isGuest) {
        showAuth();
      }
    });

    function showApp() {
      authScreen.style.display = 'none';
      appScreen.style.display = 'block';
    }

    function showAuth() {
      authScreen.style.display = 'block';
      appScreen.style.display = 'none';
    }

    // جلب بيانات المستخدم من السحابة (Firestore)
    function listenToUserData() {
      if (!currentUser) return;
      const userRef = doc(db, "users", currentUser.uid);
      onSnapshot(userRef, (docSnap) => {
        if (docSnap.exists()) {
          transactions = docSnap.data().transactions || [];
        } else {
          transactions = [];
          syncData();
        }
        updateUI();
      });
    }

    // جلب بيانات الزائر من ذاكرة الهاتف LocalStorage
    function loadGuestData() {
      transactions = JSON.parse(localStorage.getItem('simple_wallet_tx') || '[]');
      updateUI();
    }

    // حفظ البيانات
    async function syncData() {
      if (currentUser) {
        await setDoc(doc(db, "users", currentUser.uid), { transactions }, { merge: true });
      } else if (isGuest) {
        localStorage.setItem('simple_wallet_tx', JSON.stringify(transactions));
      }
      updateUI();
    }

    // إضافة معاملة جديدة
    txForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const type = document.getElementById('txType').value;
      const amount = parseFloat(document.getElementById('txAmount').value);
      const desc = document.getElementById('txDesc').value.trim();

      if (!amount || amount <= 0) return;

      transactions.push({
        id: Date.now(),
        type,
        amount,
        desc,
        date: new Date().toLocaleDateString('ar-YE')
      });

      syncData();
      txForm.reset();
    });

    // تحديث الواجهة وحساب المجاميع
    function updateUI() {
      let income = 0;
      let expense = 0;

      txList.innerHTML = '';

      if (transactions.length === 0) {
        txList.innerHTML = `<li style="text-align:center; color:var(--text-muted); padding:15px; font-size:0.85rem;">لا توجد معاملات مسجلة حتى الآن</li>`;
      }

      transactions.slice().reverse().forEach(t => {
        if (t.type === 'income') income += t.amount;
        else expense += t.amount;

        const li = document.createElement('li');
        li.className = 'tx-item';
        li.innerHTML = `
          <div>
            <strong style="display:block; font-size:0.88rem;">${escapeHTML(t.desc)}</strong>
            <span style="font-size:0.75rem; color:var(--text-muted);">${t.date}</span>
          </div>
          <div style="display:flex; align-items:center; gap:10px;">
            <span class="tx-amount ${t.type}">${t.type === 'income' ? '+' : '-'}${t.amount.toLocaleString()}</span>
            <button onclick="deleteTx(${t.id})" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">✕</button>
          </div>
        `;
        txList.appendChild(li);
      });

      document.getElementById('totalIncome').textContent = income.toLocaleString();
      document.getElementById('totalExpense').textContent = expense.toLocaleString();
      document.getElementById('totalBalance').textContent = (income - expense).toLocaleString();
    }

    // حذف معاملة
    window.deleteTx = function(id) {
      transactions = transactions.filter(t => t.id !== id);
      syncData();
    };

    function escapeHTML(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
  </script>
</body>
</html>
