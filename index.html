<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محفظتي الذكية | إدارة الأموال والمصاريف</title>
  
  <!-- خط Cairo ورسومات FontAwesome و Chart.js -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #0b132b;
      --bg-card: rgba(28, 37, 65, 0.65);
      --border-line: rgba(255, 255, 255, 0.1);
      --primary: #10b981;
      --danger: #ef4444;
      --accent: #3b82f6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body {
      background: radial-gradient(circle at top right, #1c2541, #0b132b);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .container { width: min(1000px, 92%); margin: auto; padding-top: 25px; }

    /* Header */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 20px; border-radius: 16px; margin-bottom: 25px;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.3rem; color: var(--primary); }
    .brand i { font-size: 1.6rem; }

    /* Glassmorphism Styles */
    .glass {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-line);
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* Cards Grid */
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-bottom: 25px; }
    .card { padding: 20px; text-align: center; }
    .card h4 { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 8px; }
    .card .amount { font-size: 1.8rem; font-weight: 700; }
    .card.income .amount { color: var(--primary); }
    .card.expense .amount { color: var(--danger); }
    .card.savings .amount { color: var(--accent); }

    /* Budget Progress Bar */
    .budget-section { padding: 20px; margin-bottom: 25px; }
    .budget-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .progress-bar { width: 100%; height: 12px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); transition: width 0.4s ease, background 0.4s ease; border-radius: 10px; }

    /* Form & Chart Grid */
    .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }

    .form-box, .chart-box { padding: 22px; }
    .form-box h3, .chart-box h3 { margin-bottom: 18px; font-size: 1.1rem; }

    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-muted); }
    input, select {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border-line);
      background: rgba(11, 19, 43, 0.6); color: var(--text); outline: none; font-size: 0.95rem;
    }
    input:focus, select:focus { border-color: var(--primary); }

    .btn {
      width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: 700;
      background: var(--primary); color: #0b132b; cursor: pointer; transition: 0.2s;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-2px); }

    /* Transactions List */
    .transactions-box { padding: 22px; }
    .transactions-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .tx-list { list-style: none; max-height: 300px; overflow-y: auto; }
    .tx-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 15px; border-bottom: 1px solid var(--border-line);
    }
    .tx-item:last-child { border-bottom: none; }
    .tx-info { display: flex; align-items: center; gap: 12px; }
    .tx-icon {
      width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
      background: rgba(255,255,255,0.05); font-size: 1.1rem;
    }
    .tx-amount { font-weight: 700; }
    .tx-amount.plus { color: var(--primary); }
    .tx-amount.minus { color: var(--danger); }
    .delete-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; margin-right: 10px; }
    .delete-btn:hover { color: var(--danger); }

    /* Alert Banner */
    .alert {
      display: none; padding: 12px 18px; border-radius: 12px; margin-bottom: 20px;
      background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #fca5a5;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="glass">
      <div class="brand">
        <i class="fa-solid fa-wallet"></i>
        <span>محفظتي الذكية</span>
      </div>
      <div>
        <button class="btn" onclick="setBudget()" style="padding: 8px 16px; width: auto; font-size: 0.85rem;">
          <i class="fa-solid fa-gear"></i> ضبط الميزانية
        </button>
      </div>
    </header>

    <!-- Alert Banner -->
    <div class="alert" id="budgetAlert">
      <i class="fa-solid fa-triangle-exclamation"></i> <strong>تنبيه:</strong> لقد اقتربت من استهلاك الميزانية الشهرية كاملة أو تجاوزتها!
    </div>

    <!-- Dashboard Cards -->
    <div class="dashboard-grid">
      <div class="card glass income">
        <h4>إجمالي الدخل</h4>
        <div class="amount" id="incomeVal">$0</div>
      </div>
      <div class="card glass expense">
        <h4>إجمالي المصاريف</h4>
        <div class="amount" id="expenseVal">$0</div>
      </div>
      <div class="card glass savings">
        <h4>المتبقي / المدخرات</h4>
        <div class="amount" id="savingsVal">$0</div>
      </div>
    </div>

    <!-- Budget Progress -->
    <div class="budget-section glass">
      <div class="budget-header">
        <span>الميزانية الشهرية المحددة: <strong id="budgetTarget">$0</strong></span>
        <span id="budgetPercent">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Main Grid: Form & Chart -->
    <div class="main-grid">
      <!-- Add Transaction Form -->
      <div class="form-box glass">
        <h3><i class="fa-solid fa-plus-circle"></i> إضافة معاملة جديدة</h3>
        <form id="txForm">
          <div class="input-group">
            <label>نوع المعاملة</label>
            <select id="type">
              <option value="expense">مصروف (-)</option>
              <option value="income">دخل (+)</option>
            </select>
          </div>
          <div class="input-group">
            <label>التصنيف</label>
            <select id="category">
              <option value="طعام"> طعام ومشروبات</option>
              <option value="سكن"> سكن وفواتير</option>
              <option value="مواصفات"> مواصلات ونقل</option>
              <option value="تعليم"> تعليم ودورات</option>
              <option value="ترفيه"> ترفيه وتسوق</option>
              <option value="راتب"> راتب / عمل حر</option>
              <option value="أخرى"> أخرى</option>
            </select>
          </div>
          <div class="input-group">
            <label>المبلغ ($)</label>
            <input type="number" id="amount" placeholder="0.00" required step="any">
          </div>
          <div class="input-group">
            <label>الوصف</label>
            <input type="text" id="description" placeholder="مثال: غداء، اشتراك إنترنت..." required>
          </div>
          <button type="submit" class="btn"><i class="fa-solid fa-check"></i> حفظ المعاملة</button>
        </form>
      </div>

      <!-- Chart Box -->
      <div class="chart-box glass">
        <h3><i class="fa-solid fa-chart-pie"></i> توزيع المصاريف حسب التصنيف</h3>
        <canvas id="expenseChart"></canvas>
      </div>
    </div>

    <!-- Transactions History -->
    <div class="transactions-box glass">
      <div class="transactions-header">
        <h3><i class="fa-solid fa-list-check"></i> سجل المعاملات الأخيرة</h3>
        <button onclick="clearAllData()" style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:0.85rem;">
          <i class="fa-solid fa-trash"></i> مسح الكل
        </button>
      </div>
      <ul class="tx-list" id="txList"></ul>
    </div>
  </div>

  <script>
    // System State
    let transactions = JSON.parse(localStorage.getItem('smart_wallet_txs')) || [];
    let monthlyBudget = parseFloat(localStorage.getItem('smart_wallet_budget')) || 1000;
    let myChart = null;

    // Initialize App
    document.addEventListener('DOMContentLoaded', () => {
      initChart();
      updateApp();
    });

    // Form Submit Handler
    document.getElementById('txForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const type = document.getElementById('type').value;
      const category = document.getElementById('category').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const description = document.getElementById('description').value;

      const transaction = {
        id: Date.now(),
        type,
        category,
        amount,
        description,
        date: new Date().toLocaleDateString('ar-EG')
      };

      transactions.push(transaction);
      saveAndRefresh();
      document.getElementById('txForm').reset();
    });

    // Update Storage & UI
    function saveAndRefresh() {
      localStorage.setItem('smart_wallet_txs', JSON.stringify(transactions));
      localStorage.setItem('smart_wallet_budget', monthlyBudget.toString());
      updateApp();
    }

    // Core Update Logic
    function updateApp() {
      // Calculators
      const income = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
      const expense = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);
      const savings = income - expense;

      // Update Top Cards
      document.getElementById('incomeVal').textContent = `$${income.toFixed(2)}`;
      document.getElementById('expenseVal').textContent = `$${expense.toFixed(2)}`;
      document.getElementById('savingsVal').textContent = `$${savings.toFixed(2)}`;
      document.getElementById('budgetTarget').textContent = `$${monthlyBudget.toFixed(2)}`;

      // Update Budget Progress
      const percentUsed = monthlyBudget > 0 ? (expense / monthlyBudget) * 100 : 0;
      const fillEl = document.getElementById('progressFill');
      fillEl.style.width = `${Math.min(percentUsed, 100)}%`;
      document.getElementById('budgetPercent').textContent = `${percentUsed.toFixed(1)}%`;

      // Alert Warning
      const alertEl = document.getElementById('budgetAlert');
      if (percentUsed >= 85) {
        alertEl.style.display = 'block';
        fillEl.style.background = 'var(--danger)';
      } else {
        alertEl.style.display = 'none';
        fillEl.style.background = 'var(--primary)';
      }

      // Render Transaction List
      renderList();

      // Update Chart Data
      updateChart();
    }

    // Render List UI
    function renderList() {
      const listEl = document.getElementById('txList');
      listEl.innerHTML = '';

      if (transactions.length === 0) {
        listEl.innerHTML = '<li style="text-align:center; color:var(--text-muted); padding:20px;">لا يوجد معاملات مسجلة بعد</li>';
        return;
      }

      transactions.slice().reverse().forEach(t => {
        const item = document.createElement('li');
        item.className = 'tx-item';
        const isIncome = t.type === 'income';

        item.innerHTML = `
          <div class="tx-info">
            <div class="tx-icon"><i class="fa-solid ${getCategoryIcon(t.category)}"></i></div>
            <div>
              <strong>${t.description}</strong>
              <div style="font-size:0.75rem; color:var(--text-muted);">${t.category} • ${t.date}</div>
            </div>
          </div>
          <div style="display:flex; align-items:center;">
            <span class="tx-amount ${isIncome ? 'plus' : 'minus'}">
              ${isIncome ? '+' : '-'}$${t.amount.toFixed(2)}
            </span>
            <button class="delete-btn" onclick="deleteTx(${t.id})"><i class="fa-solid fa-xmark"></i></button>
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    // Helper Category Icons
    function getCategoryIcon(cat) {
      switch (cat) {
        case 'طعام': return 'fa-utensils';
        case 'سكن': return 'fa-house';
        case 'مواصفات': return 'fa-bus';
        case 'تعليم': return 'fa-graduation-cap';
        case 'ترفيه': return 'fa-gamepad';
        case 'راتب': return 'fa-money-bill-wave';
        default: return 'fa-tag';
      }
    }

    // Chart.js Configuration
    function initChart() {
      const ctx = document.getElementById('expenseChart').getContext('2d');
      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: [],
          datasets: [{
            data: [],
            backgroundColor: ['#ef4444', '#3b82f6', '#f59e0b', '#10b981', '#8b5cf6', '#ec4899', '#64748b']
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'bottom', labels: { color: '#f8fafc', font: { family: 'Cairo' } } }
          }
        }
      });
    }

    function updateChart() {
      const categories = {};
      transactions.filter(t => t.type === 'expense').forEach(t => {
        categories[t.category] = (categories[t.category] || 0) + t.amount;
      });

      myChart.data.labels = Object.keys(categories);
      myChart.data.datasets[0].data = Object.values(categories);
      myChart.update();
    }

    // Operations
    function deleteTx(id) {
      transactions = transactions.filter(t => t.id !== id);
      saveAndRefresh();
    }

    function setBudget() {
      const val = prompt('أدخل قيمة الميزانية الشهرية المستهدفة ($):', monthlyBudget);
      if (val !== null && !isNaN(parseFloat(val))) {
        monthlyBudget = parseFloat(val);
        saveAndRefresh();
      }
    }

    function clearAllData() {
      if (confirm('هل أنت تأكد من مسح جميع البيانات المسجلة؟')) {
        transactions = [];
        saveAndRefresh();
      }
    }
  </script>
</body>
</html>
